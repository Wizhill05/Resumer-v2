name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend on resumer-vps
    runs-on: [self-hosted, resumer-vps]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rebuild and restart backend
        working-directory: /opt/resumer
        run: |
          set -euo pipefail
          # Keep production Compose, environment, and tunnel files in /opt/resumer.
          # Only the backend build source comes from the runner's clean checkout.
          override=$(mktemp "${RUNNER_TEMP}/resumer-build.XXXXXX.yml")
          trap 'rm -f "$override"' EXIT
          cat > "$override" <<'YAML'
          services:
            backend:
              build:
                context: ${GITHUB_WORKSPACE}/backend
                dockerfile: Dockerfile
          YAML
          docker compose -f docker-compose.yml -f "$override" build backend
          docker compose -f docker-compose.yml -f "$override" up -d --no-build backend

      - name: Health check
        run: |
          set +e
          for i in $(seq 1 20); do
            sleep 3
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:48000/mcp -H "Content-Type: application/json" -d "{}")
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "401" ]; then
              echo "backend healthy (401 = auth-guarded MCP endpoint)"
              exit 0
            fi
          done
          echo "backend unhealthy after deploy"
          docker logs resumer-backend-1 | tail -20
          exit 1
