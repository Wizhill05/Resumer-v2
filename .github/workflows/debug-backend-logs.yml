name: Debug Backend Logs (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    name: Fetch Container App State + Logs
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: App state, revisions, recent logs
        env:
          APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          RG_NAME: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az extension add --name containerapp --upgrade --yes
          echo "=== APP STATE ==="
          az containerapp show -n "$APP_NAME" -g "$RG_NAME" \
            --query "{fqdn:properties.configuration.ingress.fqdn,running:properties.runningStatus,provisioning:properties.provisioningState,latestRev:properties.latestRevisionName,replicas:properties.runningStatus}" -o json || true
          echo "=== REVISIONS ==="
          az containerapp revision list -n "$APP_NAME" -g "$RG_NAME" -o table || true
          echo "=== REPLICA COUNT ==="
          az containerapp replica list -n "$APP_NAME" -g "$RG_NAME" --query "[].{name:name,running:properties.runningState}" -o table || true
          echo "=== RECENT LOGS (tail 200) ==="
          az containerapp logs show -n "$APP_NAME" -g "$RG_NAME" --tail 200 || true

      - name: HTTP probe (ingress + health)
        env:
          APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          RG_NAME: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RG_NAME" --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Probing ingress..."
          curl -s -o /dev/null -w "root: %{http_code} in %{time_total}s\n" --max-time 25 "https://$FQDN/" || true
          curl -s -o /dev/null -w "health: %{http_code} in %{time_total}s\n" --max-time 25 "https://$FQDN/system/health" || true
          curl -s --max-time 25 "https://$FQDN/system/health" || true
          echo
          nslookup "$FQDN" | tail -4 || true
