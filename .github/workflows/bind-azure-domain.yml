name: Bind Custom Domain to Azure Container App (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bind-domain:
    name: Add Custom Domain and Managed Cert
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Add Custom Domain
        run: |
          echo "=== ADDING CUSTOM DOMAIN ==="
          az containerapp hostname add \
            -n resumer-backend \
            -g Resumer \
            --hostname resume-backend.aryansingh.space

      - name: Bind Managed Certificate
        run: |
          echo "=== BINDING MANAGED CERTIFICATE ==="
          az containerapp hostname bind \
            -n resumer-backend \
            -g Resumer \
            --hostname resume-backend.aryansingh.space \
            --environment orangebush-e86649df \
            --validation-method CNAME || true
