name: Bind Custom Domain to Azure Container App (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bind-domain:
    name: Get Verification ID and Bind Domain
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Verification ID
        run: |
          echo "=== GET CUSTOM DOMAIN VERIFICATION ID ==="
          az containerapp show -n resumer-backend -g Resumer --query "properties.customDomainVerificationId" -o tsv
